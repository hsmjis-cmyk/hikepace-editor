<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>산행 페이스 코스 편집기</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f4f6f2;--card:#fff;--ink:#18201b;--muted:#5f6a62;--line:#dde2da;--accent:#2e6b45;--accent-soft:#e3efe7;--warn:#b45309;--err:#b42318;--sel:#e8590c;--fix:#2b6cb0;--peak:#7b2d5a;--field:#fafbf9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:14px/1.45 -apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:var(--bg)}
#app{display:grid;grid-template-columns:400px 1fr;height:100vh}
#side{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--card);min-width:0;min-height:0}
#top{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#top h1{font-size:15px;margin:0;display:flex;align-items:center;gap:8px;justify-content:space-between}
#top h1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:6px 10px}
button:hover{border-color:#b9c2b5}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
button.danger{color:var(--err)}
button:disabled{opacity:.45;cursor:default}
button.sm{padding:3px 8px;font-size:12px}
nav{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--line)}
nav button{border:0;border-radius:0;border-bottom:3px solid transparent;padding:9px 2px;background:none;color:var(--muted)}
nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700;background:none}
.panel{flex:1;overflow:auto;padding:12px;display:none;min-height:0}
.panel.on{display:block}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:8px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;margin:4px 0}
.chk input{width:auto}
.msg{font-size:12px;color:var(--muted);margin:6px 0}
.msg.err{color:var(--err)}.msg.ok{color:var(--accent)}
h3{font-size:13px;margin:14px 0 6px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:2px}
.it{display:grid;grid-template-columns:24px 1fr auto;gap:6px;align-items:center;padding:6px;border-radius:8px;border:1px solid transparent;cursor:pointer;text-align:left;background:none}
.it:hover{background:var(--field)}
.it.on{border-color:var(--sel);background:#fff4ec}
.it .n{font-size:11px;font-weight:800;color:#fff;background:var(--ink);border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.it .n.pk{background:var(--peak)}
.it b{font-weight:700}.it small{display:block;color:var(--muted);font-size:12px}
.it .r{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.bad{color:var(--warn);font-weight:700}
.box{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--field);margin:8px 0}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.stat div{background:var(--field);border-radius:8px;padding:6px;text-align:center}
.stat b{display:block;font-size:15px}.stat small{color:var(--muted);font-size:11px}
#map{height:100vh;position:relative;z-index:1}
#nbox{position:absolute;inset:0;z-index:0;display:none;pointer-events:none}
#nmap{width:100%;height:100%}
.nv #map.leaflet-container{background:transparent}
#modebar{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:1000;background:#18201b;color:#fff;border-radius:10px;padding:8px 12px;display:none;gap:8px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.3);font-size:13px}
#modebar button{padding:4px 10px;font-size:12px;white-space:nowrap}#modebar{flex-wrap:wrap;max-width:calc(100% - 120px)}
#ptbar{position:absolute;left:56px;top:10px;z-index:1000;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;display:none;gap:4px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.18);font-size:13px;flex-wrap:wrap;max-width:calc(100% - 70px)}
#ptbar .t{font-weight:700;color:var(--muted);padding:0 4px;font-size:12px}#ptbar button{padding:4px 10px;font-size:12px}#ptbar select{width:auto;padding:4px 6px;font-size:12px}
.vx.pick{background:var(--sel);transform:scale(1.4)}.vx.del{border-color:#d32f2f;cursor:pointer}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#18201b;color:#fff;padding:9px 14px;border-radius:10px;z-index:2000;display:none;max-width:70vw;font-size:13px}
.cpm{position:relative;width:0;height:0}
.cpm i{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #18201b;box-sizing:border-box;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.cpm.pk i{background:var(--peak);border-color:#fff}
.cpm.on i{border-color:var(--sel);box-shadow:0 0 0 4px rgba(232,89,12,.35)}
.cpm b{pointer-events:none;position:absolute;left:12px;top:-10px;background:rgba(255,255,255,.94);border:1px solid #c9cfc6;border-radius:6px;padding:0 5px;font-size:11px;white-space:nowrap;font-weight:700}
.cpm.pk b{color:var(--peak);border-color:var(--peak)}
.vx{width:11px;height:11px;margin:-5.5px 0 0 -5.5px;background:#fff;border:2px solid var(--sel);border-radius:2px;box-sizing:border-box}
.vg{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:rgba(232,89,12,.35);border:1px solid var(--sel);border-radius:50%;box-sizing:border-box}
.rh{width:14px;height:14px;margin:-7px 0 0 -7px;background:#d32f2f;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:ew-resize}
.tg{position:relative;width:0;height:0}
.tg i{cursor:pointer;}.tg.ed i{cursor:move;box-shadow:0 0 0 4px rgba(255,193,7,.8)}
.tg.on i{box-shadow:0 0 0 4px rgba(211,47,47,.35)}
.tg i{position:absolute;left:-6px;top:-6px;width:12px;height:12px;background:#d32f2f;transform:rotate(45deg);border:2px solid #fff;box-sizing:border-box}
.tg b{position:absolute;left:10px;top:-22px;color:#b71c1c;font-size:11px;font-weight:800;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff}
.hp table{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0 10px}.hp th{background:var(--accent);color:#fff;text-align:left;padding:5px 6px;font-weight:700;white-space:nowrap}
.hp td{border-bottom:1px solid var(--line);padding:5px 6px;vertical-align:top}.hp td:first-child{font-weight:700;white-space:nowrap}.hp h3{color:var(--ink);font-size:14px;margin:16px 0 4px}.hp ol{padding-left:18px;margin:4px 0;font-size:13px}.hp li{margin:3px 0}
details.fold>summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px;list-style:revert}
.cathd{margin:12px 0 4px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.04em;border-bottom:1px solid var(--line,#ddd)}
details.tree{margin:2px 0 2px 6px}details.tree>summary{cursor:pointer;padding:5px 2px;list-style:revert}
.mthd{margin:6px 0 1px}small.chips{display:block;color:#2b6cb0}.tgl{font-size:12px;margin:-2px 0 4px}
.seg button.on{background:var(--accent,#2e6b45);color:#fff}
.lg{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.lg span::before{content:"";display:inline-block;width:14px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:2px;background:var(--c)}
kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:#fff}
.drop{position:fixed;inset:0;background:rgba(46,107,69,.25);border:4px dashed var(--accent);z-index:3000;display:none;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--accent)}
/* ===== 앱 안 '지도 편집' (editor.html?app=1) · 휴대폰 화면 ===== */
body.app #app{display:block;position:relative;height:100vh;height:100dvh}
body.app #mapWrap{position:absolute;inset:0}
body.app #map{height:100vh;height:100dvh}
body.app #side{position:absolute;left:0;right:0;bottom:0;height:48vh;z-index:1500;border-radius:16px 16px 0 0;border-right:0;box-shadow:0 -4px 18px rgba(0,0,0,.18);transition:height .2s}
body.app.sheetMin #side{height:132px}body.app.sheetMax #side{height:86vh}
body.app #grab{display:block;width:44px;height:5px;border-radius:3px;background:#c9cfc6;margin:8px auto 0;flex:none}
#grab{display:none}
body.app #top{padding:6px 12px 8px;gap:6px}body.app #top h1{font-size:14px}body.app #top h1 .row{flex-wrap:nowrap}body.app #top .row button{padding:8px 14px}
body.app button{padding:9px 12px;font-size:15px}body.app button.sm{padding:6px 10px;font-size:13px}
body.app nav{grid-template-columns:repeat(3,1fr)}body.app nav button{font-size:15px;padding:10px 2px}
body.app nav button[data-t=recs],body.app nav button[data-t=gpx],body.app nav button[data-t=repo]{display:none}
body.app #openB,body.app #saveB,body.app #upB,body.app #helpB{display:none}
body.app .it{padding:9px 6px}body.app input,body.app select{padding:9px 10px;font-size:15px}
body.app #ptbar{left:8px;top:8px;right:8px;flex-wrap:wrap}
body.app #toast{bottom:auto;top:12px;max-width:92vw}
.meDot{width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
#locB{position:absolute;right:10px;top:84px;z-index:1000;display:none;font-size:20px;width:44px;height:44px;padding:0;border-radius:10px;box-shadow:0 1px 5px rgba(0,0,0,.3)}
body.app #locB{display:block}
.ptab{border-collapse:collapse;font-size:12px;width:100%;margin:4px 0 8px}.ptab th,.ptab td{border-bottom:1px solid #e3e6e1;padding:4px 5px;text-align:right;white-space:nowrap}.ptab th{color:#667;font-weight:600}.ptab td.l,.ptab th:first-child{text-align:left;white-space:normal;word-break:keep-all}.ptab tr.sum td{font-weight:700;border-top:2px solid #cfd5cc}
/* ===== 새 산행 만들기 ===== */
.nwhd{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff4e6;border:1px solid #f5c08a;border-radius:10px;padding:8px 10px;margin:4px 0 6px}.nwhd b{color:#c2410c;font-size:15px}
#newB{background:#fff4e6;border-color:#f5c08a;color:#c2410c;font-weight:700}
.nwp{position:relative;width:0;height:0}.nwp i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:#475569;border:2px solid #fff;box-sizing:border-box;cursor:pointer;box-shadow:0 0 2px rgba(0,0,0,.5)}
.nwp.pk i{background:#c2410c;width:12px;height:12px;left:-6px;top:-6px}
.nwp b{position:absolute;left:9px;top:-9px;font-size:11px;font-weight:700;color:#334155;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;pointer-events:none}.nwp.pk b{color:#9a3412}
body.keys [data-key]{position:relative;overflow:visible}body.keys [data-key]::after{content:attr(data-key);position:absolute;top:-9px;right:-6px;z-index:5;background:#b45309;color:#fff;font:700 10px/1.5 system-ui,sans-serif;padding:0 4px;border-radius:4px;white-space:nowrap;pointer-events:none}
body.keys select[data-key]{outline:2px solid #b45309}body.keys h1 [data-key]::after{top:50%;right:auto;left:50%;transform:translate(-50%,-50%)}
#keyCard{position:absolute;right:12px;top:12px;z-index:1200;background:#fff;border:1px solid #cbd5e1;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px 12px;width:min(620px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;font-size:12px}
#keyCard .kh{display:flex;align-items:center;gap:10px;margin-bottom:6px}#keyCard .kh b{font-size:14px}#keyCard .kh span{color:#64748b;flex:1}
#keyCard .kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:4px 16px}#keyCard h4{margin:8px 0 3px;font-size:12px;color:#334155}
#keyCard .kr{display:flex;gap:8px;align-items:baseline;padding:1px 0}#keyCard kbd{flex:none;min-width:58px;font:600 11px/1.5 ui-monospace,monospace;background:#f1f5f9;border:1px solid #cbd5e1;border-bottom-width:2px;border-radius:4px;padding:0 5px;text-align:center}
.gan{position:relative;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid #dc2626;color:#b91c1c;font:700 11px/16px system-ui;text-align:center}
#p-gpx label.chk{white-space:nowrap;display:inline-flex;align-items:center;gap:4px}.garow{display:flex;gap:6px;align-items:center;padding:5px 0;border-top:1px solid #e5e7eb}.garow b{font-size:12px}
.acc{position:relative;width:0;height:0}.acc i{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #6b7280;box-sizing:border-box;cursor:pointer}.acc b{position:absolute;left:9px;top:-9px;font-size:11px;font-weight:700;color:#374151;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;cursor:pointer}.acc.cat i{left:-9px;top:-9px;width:18px;height:18px;border:3px dashed #b71c1c;background:#fde2e1}.acc.cat b{left:12px;top:-10px;color:#b71c1c}
.nwk{position:relative;width:0;height:0}.nwk i{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;background:#e8590c;color:#fff;font-style:normal;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-sizing:border-box;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.nwk.ct i{background:#b71c1c}.nwk b{position:absolute;left:14px;top:-10px;background:rgba(255,255,255,.95);border:1px solid #e8590c;border-radius:6px;padding:0 5px;font-size:11px;white-space:nowrap;font-weight:700;color:#9a3412;pointer-events:none}
.nwrow{display:flex;align-items:center;gap:6px}.nwrow input{padding:4px 6px;font-size:13px;width:100%}.nwrow small{display:block}.nwrow .r{display:flex;gap:2px}
body.app #newB{display:none}
body.app #modebar{left:56px;right:8px;transform:none;flex-wrap:wrap;font-size:13px;padding:8px 10px}body.app #modebar>span{flex:1 1 160px;min-width:0}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="grab" title="끌어올리기/내리기"></div>
    <div id="top">
      <h1><span id="ttl">산행 페이스 코스 편집기</span><span class="row"><button class="sm" id="helpB" title="도움말 (F1) · 단축키 카드는 ?">? 도움말</button><button class="sm" id="undoB" title="되돌리기 (Ctrl+Z)">↶</button><button class="sm" id="redoB" title="다시 (Ctrl+Y)">↷</button></span></h1>
      <div class="row">
        <button id="newB" title="산 이름을 찾고 지도에서 지점을 찍어 새 코스 만들기">＋ 새 산행</button>
        <button id="openB">파일 열기</button>
        <button id="saveB">파일로 저장</button>
        <button class="pri" id="upB">앱에 올리기</button>
        <select id="layerSel" style="width:auto"></select>
      </div>
      <p class="msg" id="dirty" style="margin:0"></p>
    </div>
    <nav id="tabs">
      <button data-t="course" class="on">코스</button><button data-t="cps">지점</button><button data-t="segs">구간</button><button data-t="recs">기록</button><button data-t="gpx">GPX</button><button data-t="repo">저장소</button>
    </nav>
    <section class="panel on" id="p-course"></section>
    <section class="panel" id="p-cps"></section>
    <section class="panel" id="p-segs"></section>
    <section class="panel" id="p-recs"></section>
    <section class="panel" id="p-gpx"></section>
    <section class="panel" id="p-repo"></section>
    <section class="panel" id="p-help"></section>
    <section class="panel" id="p-new"></section>
  </aside>
  <div id="mapWrap" style="position:relative;min-width:0"><div id="nbox"><div id="nmap"></div></div><div id="map"></div><div id="modebar"></div><div id="ptbar"></div><button id="locB" title="내 위치">◎</button></div>
</div>
<div id="toast"></div>
<div class="drop" id="drop">코스(.json)나 GPX(.gpx) 파일을 놓으세요</div>
<input type="file" id="fileIn" accept=".json,.gpx,application/json,application/gpx+xml" hidden>
<input type="file" id="gpxIn" accept=".gpx,application/gpx+xml" hidden>
<input type="file" id="catIn" accept=".json,application/json" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
"use strict";
// ============ 공통 ============
var RAD=Math.PI/180;
function $(id){return document.getElementById(id);}
function h(tag,a,kids){var e=document.createElement(tag);if(a)for(var k in a){var v=a[k];if(v==null||v===false)continue;
  if(k==="text")e.textContent=v;else if(k==="html")e.innerHTML=v;else if(k==="cls")e.className=v;else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);else if(k==="value")e.value=v;else if(k==="checked")e.checked=!!v;else e.setAttribute(k,v===true?"":v);}
  (kids||[]).forEach(function(c){if(c!=null)e.appendChild(typeof c==="string"?document.createTextNode(c):c);});return e;}
function hav(a,b){var dLat=(b[0]-a[0])*RAD,dLon=(b[1]-a[1])*RAD,s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a[0]*RAD)*Math.cos(b[0]*RAD)*Math.sin(dLon/2)*Math.sin(dLon/2);return 2*6371000*Math.asin(Math.min(1,Math.sqrt(s)));}
function lenM(pts){var m=0;for(var i=1;i<pts.length;i++)m+=hav(pts[i-1],pts[i]);return m;}
function r6(x){return +(+x).toFixed(6);}
var tt=null;function toast(t,ms){var e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(tt);tt=setTimeout(function(){e.style.display="none";},ms||3200);}
function normT(v){if(v==null||v==="")return "";var m=String(v).trim().match(/^(\d{1,2}):(\d{2})$/);if(!m)return null;var H=+m[1],M=+m[2];if(H>23||M>59)return null;return (H<10?"0":"")+H+":"+m[2];}
function hm(t){var m=String(t||"").match(/^(\d{1,2}):(\d{2})$/);return m?+m[1]*60+ +m[2]:null;}
function fmt(m){m=Math.round(m);m=((m%1440)+1440)%1440;return ("0"+Math.floor(m/60)).slice(-2)+":"+("0"+m%60).slice(-2);}
function b64e(t){return btoa(unescape(encodeURIComponent(t)));}
function b64d(c){return decodeURIComponent(escape(atob(String(c||"").replace(/\s/g,""))));}

function esc(t){return String(t).replace(/[<>&"]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c];});}

// ============ 상태 ============
var META=null;   // {id,name,sport,date,endTime,endLabel,notes,extra}
var CP=[];       // 지점 (공개 형식 필드: name,km,arrive,depart,note,peak,radiusKm,cutoff,cutoffBy,cutoffAction,route,lat,lon)
var SEG=[];      // SEG[i]: 지점 i → i+1 경로 [[lat,lon,ele|null],...]
var HOW=[];      // 구간별 마지막 작업 표시
var GPX=null;    // 참고용 GPX {name,pts:[[lat,lon,ele]],wpts:[{name,lat,lon}]}
var CAT=null,CAT_SHA=null,CAT_DIRTY={}; // 산 목록(인증 지점)
var NET=null,NET_BOX=null,NET_LOADING=null;
var sel={t:null,i:-1};   // {t:"cp"|"seg"|"tgt", i}

function hpFamTitle(fs){var named=fs.filter(function(c){return c.family;})[0];if(named)return named.family;

// 구간 예상 평균 속도 (km, 분) → "2.5" (km/h) · 계산 안 되면 ""

var HP_PACE_DEF={perKm:11,up:10.6,dn:3.8,roadKm:12.6,margin:15,rough:1.3,winter:5}; // rough = 암릉·바위 구간 배율(v9.2), winter = 겨울(12~2월) 추가 마진 %

// rows[i]: {from,to,km,up,dn,min(이동),kmh,rest(도착 지점에서 쉬는 분),arrive} · move/rest/total(분) · km · kmh(쉬는 시간 포함 전체 평균) · kmhMove

// "이동 4:43 + 휴식 0:30 = 총 5:13 · 전체 평균 2.1km/h (휴식 포함)"
function hpHM(m){m=Math.round(m||0);return Math.floor(m/60)+":"+("0"+(m%60)).slice(-2);}

// 해 뜨는·지는 시각 (기기 시간대 기준 분, 오차 ±2분쯤) · date: "YYYY-MM-DD" 또는 Date

// 산불조심기간 (봄 2/1~5/15 · 가을 11/1~12/15): 국립공원·일부 산은 탐방로를 통제할 수 있다. date "YYYY-MM-DD" (없으면 오늘)

// ===== 코스 트리 (v8.5): 분류 › 프로그램 › [시·도] › 산 › 코스 · 대간·정맥·둘레길은 프로그램 › 코스(구간 순서) =====

// index.json 항목에는 tg(지나는 인증 지점 id)·pin·cpn(지점 이름)을 저장할 때 같이 넣는다(편집기·앱·tools/index_links.js).

function hpSidoCmp(a,b){var i=HP_SIDO.indexOf(a),j=HP_SIDO.indexOf(b);return (i<0?99:i)-(j<0?99:j)||String(a).localeCompare(String(b),"ko");}

function hpCourseLink(pts,group,targets){var tg=hpPassTargets(pts,targets);if(tg.length||!group||!pts||!pts.length)return {tg:tg,pin:false};

// 검색: 띄어쓰기·기호 무시, 초성(ㄴㅈㅅ) 가능 · 맞으면 true

// opts: {q:검색어, all:true 면 코스 없는 산도 보임}
// 결과: {cats:[{n,progs:[P]}], unlinked:[c], archived:[c], n:보이는 코스 수}
// P: {p,trail,courses(코스 수),plan(코스가 지나는 인증 지점 수),total, regions:[{n,mts:[M],plan,total}] 또는 null, mts:[M](시·도 없을 때), list:[{c,tg,first}](trail)}
// M: {tid,t,cs:[c](선택지 묶음 포함),pin:true(고정만)}
function hpCourseTree(courses,programs,targets,opts){opts=opts||{};var q=(opts.q||"").trim();

// 코스 c 가 들어가는 프로그램 이름들 (줄에 칩으로) · 지금 보고 있는 프로그램 id 는 빼고
function hpCoursePgms(c,programs,skip){return programs.filter(function(p){return p.id!==skip&&(c.tg||[]).some(function(id){return p.targets.indexOf(id)>=0;});}).map(function(p){return p.n;});}
// ===== 정맥 이어 걷기 (v8.7): 정맥 전체 길(line) 위에서 그날 출발·도착 지점을 골라 코스를 만든다 =====
// line: {format:"hikepace-line",id,prog,name,track:[[lat,lon,km]],points:[{name,km,lat,lon,up,dn,peak,rest,radiusKm,exit,exitKm,ap:{pts:[[lat,lon]](능선→역),km,up,dn},access,secStart,secEnd,src}],sections:[{id,name,s,e}]}
