<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>산행 페이스 코스 편집기</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f4f6f2;--card:#fff;--ink:#18201b;--muted:#5f6a62;--line:#dde2da;--accent:#2e6b45;--accent-soft:#e3efe7;--warn:#b45309;--err:#b42318;--sel:#e8590c;--fix:#2b6cb0;--peak:#7b2d5a;--field:#fafbf9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:14px/1.45 -apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:var(--bg)}
#app{display:grid;grid-template-columns:400px 1fr;height:100vh}
#side{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--card);min-width:0;min-height:0}
#top{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#top h1{font-size:15px;margin:0;display:flex;align-items:center;gap:8px;justify-content:space-between}
#top h1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:6px 10px}
button:hover{border-color:#b9c2b5}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
button.danger{color:var(--err)}
button:disabled{opacity:.45;cursor:default}
button.sm{padding:3px 8px;font-size:12px}
nav{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--line)}
nav button{border:0;border-radius:0;border-bottom:3px solid transparent;padding:9px 2px;background:none;color:var(--muted)}
nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700;background:none}
.panel{flex:1;overflow:auto;padding:12px;display:none;min-height:0}
.panel.on{display:block}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:8px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;margin:4px 0}
.chk input{width:auto}
.msg{font-size:12px;color:var(--muted);margin:6px 0}
.msg.err{color:var(--err)}.msg.ok{color:var(--accent)}
h3{font-size:13px;margin:14px 0 6px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:2px}
.it{display:grid;grid-template-columns:24px 1fr auto;gap:6px;align-items:center;padding:6px;border-radius:8px;border:1px solid transparent;cursor:pointer;text-align:left;background:none}
.it:hover{background:var(--field)}
.it.on{border-color:var(--sel);background:#fff4ec}
.it .n{font-size:11px;font-weight:800;color:#fff;background:var(--ink);border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.it .n.pk{background:var(--peak)}
.it b{font-weight:700}.it small{display:block;color:var(--muted);font-size:12px}
.it .r{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.bad{color:var(--warn);font-weight:700}
.box{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--field);margin:8px 0}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.stat div{background:var(--field);border-radius:8px;padding:6px;text-align:center}
.stat b{display:block;font-size:15px}.stat small{color:var(--muted);font-size:11px}
#map{height:100vh;position:relative;z-index:1}
#nbox{position:absolute;inset:0;z-index:0;display:none;pointer-events:none}
#nmap{width:100%;height:100%}
.nv #map.leaflet-container{background:transparent}
#modebar{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:1000;background:#18201b;color:#fff;border-radius:10px;padding:8px 12px;display:none;gap:8px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.3);font-size:13px}
#modebar button{padding:4px 10px;font-size:12px}
#ptbar{position:absolute;left:56px;top:10px;z-index:1000;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;display:none;gap:4px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.18);font-size:13px;flex-wrap:wrap;max-width:calc(100% - 70px)}
#ptbar .t{font-weight:700;color:var(--muted);padding:0 4px;font-size:12px}#ptbar button{padding:4px 10px;font-size:12px}#ptbar select{width:auto;padding:4px 6px;font-size:12px}
.vx.pick{background:var(--sel);transform:scale(1.4)}.vx.del{border-color:#d32f2f;cursor:pointer}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#18201b;color:#fff;padding:9px 14px;border-radius:10px;z-index:2000;display:none;max-width:70vw;font-size:13px}
.cpm{position:relative;width:0;height:0}
.cpm i{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #18201b;box-sizing:border-box;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.cpm.pk i{background:var(--peak);border-color:#fff}
.cpm.on i{border-color:var(--sel);box-shadow:0 0 0 4px rgba(232,89,12,.35)}
.cpm b{pointer-events:none;position:absolute;left:12px;top:-10px;background:rgba(255,255,255,.94);border:1px solid #c9cfc6;border-radius:6px;padding:0 5px;font-size:11px;white-space:nowrap;font-weight:700}
.cpm.pk b{color:var(--peak);border-color:var(--peak)}
.vx{width:11px;height:11px;margin:-5.5px 0 0 -5.5px;background:#fff;border:2px solid var(--sel);border-radius:2px;box-sizing:border-box}
.vg{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:rgba(232,89,12,.35);border:1px solid var(--sel);border-radius:50%;box-sizing:border-box}
.rh{width:14px;height:14px;margin:-7px 0 0 -7px;background:#d32f2f;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:ew-resize}
.tg{position:relative;width:0;height:0}
.tg i{position:absolute;left:-6px;top:-6px;width:12px;height:12px;background:#d32f2f;transform:rotate(45deg);border:2px solid #fff;box-sizing:border-box}
.tg b{position:absolute;left:10px;top:-22px;color:#b71c1c;font-size:11px;font-weight:800;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff}
.lg{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.lg span::before{content:"";display:inline-block;width:14px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:2px;background:var(--c)}
kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:#fff}
.drop{position:fixed;inset:0;background:rgba(46,107,69,.25);border:4px dashed var(--accent);z-index:3000;display:none;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--accent)}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="top">
      <h1><span id="ttl">산행 페이스 코스 편집기</span><span class="row"><button class="sm" id="undoB" title="되돌리기 (Ctrl+Z)">↶</button><button class="sm" id="redoB" title="다시 (Ctrl+Y)">↷</button></span></h1>
      <div class="row">
        <button id="openB">파일 열기</button>
        <button id="saveB">파일로 저장</button>
        <button class="pri" id="upB">앱에 올리기</button>
        <select id="layerSel" style="width:auto"></select>
      </div>
      <p class="msg" id="dirty" style="margin:0"></p>
    </div>
    <nav id="tabs">
      <button data-t="course" class="on">코스</button><button data-t="cps">지점</button><button data-t="segs">구간</button><button data-t="recs">기록</button><button data-t="gpx">GPX</button><button data-t="repo">저장소</button>
    </nav>
    <section class="panel on" id="p-course"></section>
    <section class="panel" id="p-cps"></section>
    <section class="panel" id="p-segs"></section>
    <section class="panel" id="p-recs"></section>
    <section class="panel" id="p-gpx"></section>
    <section class="panel" id="p-repo"></section>
  </aside>
  <div id="mapWrap" style="position:relative;min-width:0"><div id="nbox"><div id="nmap"></div></div><div id="map"></div><div id="modebar"></div><div id="ptbar"></div></div>
</div>
<div id="toast"></div>
<div class="drop" id="drop">코스(.json)나 GPX(.gpx) 파일을 놓으세요</div>
<input type="file" id="fileIn" accept=".json,.gpx,application/json,application/gpx+xml" hidden>
<input type="file" id="gpxIn" accept=".gpx,application/gpx+xml" hidden>
<input type="file" id="catIn" accept=".json,application/json" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
"use strict";
// ============ 공통 ============
var RAD=Math.PI/180;
function $(id){return document.getElementById(id);}
function h(tag,a,kids){var e=document.createElement(tag);if(a)for(var k in a){var v=a[k];if(v==null||v===false)continue;
  if(k==="text")e.textContent=v;else if(k==="html")e.innerHTML=v;else if(k==="cls")e.className=v;else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);else if(k==="value")e.value=v;else if(k==="checked")e.checked=!!v;else e.setAttribute(k,v===true?"":v);}
  (kids||[]).forEach(function(c){if(c!=null)e.appendChild(typeof c==="string"?document.createTextNode(c):c);});return e;}
function hav(a,b){var dLat=(b[0]-a[0])*RAD,dLon=(b[1]-a[1])*RAD,s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a[0]*RAD)*Math.cos(b[0]*RAD)*Math.sin(dLon/2)*Math.sin(dLon/2);return 2*6371000*Math.asin(Math.min(1,Math.sqrt(s)));}
function lenM(pts){var m=0;for(var i=1;i<pts.length;i++)m+=hav(pts[i-1],pts[i]);return m;}
function r6(x){return +(+x).toFixed(6);}
var tt=null;function toast(t,ms){var e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(tt);tt=setTimeout(function(){e.style.display="none";},ms||3200);}
function normT(v){if(v==null||v==="")return "";var m=String(v).trim().match(/^(\d{1,2}):(\d{2})$/);if(!m)return null;var H=+m[1],M=+m[2];if(H>23||M>59)return null;return (H<10?"0":"")+H+":"+m[2];}
function hm(t){var m=String(t||"").match(/^(\d{1,2}):(\d{2})$/);return m?+m[1]*60+ +m[2]:null;}
function fmt(m){m=Math.round(m);m=((m%1440)+1440)%1440;return ("0"+Math.floor(m/60)).slice(-2)+":"+("0"+m%60).slice(-2);}
function b64e(t){return btoa(unescape(encodeURIComponent(t)));}
function b64d(c){return decodeURIComponent(escape(atob(String(c||"").replace(/\s/g,""))));}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
function esc(t){return String(t).replace(/[<>&"]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c];});}

// ============ 상태 ============
var META=null;   // {id,name,sport,date,endTime,endLabel,notes,extra}
var CP=[];       // 지점 (공개 형식 필드: name,km,arrive,depart,note,peak,radiusKm,cutoff,cutoffBy,cutoffAction,route,lat,lon)
var SEG=[];      // SEG[i]: 지점 i → i+1 경로 [[lat,lon,ele|null],...]
var HOW=[];      // 구간별 마지막 작업 표시
var GPX=null;    // 참고용 GPX {name,pts:[[lat,lon,ele]],wpts:[{name,lat,lon}]}
var CAT=null,CAT_SHA=null,CAT_DIRTY={}; // 산 목록(인증 지점)
var NET=null,NET_BOX=null,NET_LOADING=null;
var sel={t:null,i:-1};   // {t:"cp"|"seg"|"tgt", i}
var mode=null;           // null | {k:"addcp"} | {k:"draw",i,pts,marks}
var undoS=[],redoS=[],dirty=false,lastSaved=null;

function snap(){return JSON.stringify({META:META,CP:CP,SEG:SEG,HOW:HOW});}
function push(){if(!META)return;undoS.push(snap());if(undoS.length>80)undoS.shift();redoS=[];setDirty(true);}
function restore(s){var o=JSON.parse(s);META=o.META;CP=o.CP;SEG=o.SEG;HOW=o.HOW||[];if(sel.t==="cp"&&sel.i>=CP.length)sel={t:null,i:-1};if(sel.t==="seg"&&sel.i>=SEG.length)sel={t:null,i:-1};drawAll();renderPanels();}
function undo(){if(!undoS.length)return;redoS.push(snap());restore(undoS.pop());setDirty(true);}
function redo(){if(!redoS.length)return;undoS.push(snap());restore(redoS.pop());setDirty(true);}
function setDirty(d){dirty=d;$("dirty").textContent=META?(d?"● 저장 안 한 변경이 있어요":"변경 없음")+(lastSaved?" · 마지막 저장 "+lastSaved:""):"코스를 열거나 GPX로 새 코스를 만드세요.";$("dirty").className=d?"msg bad":"msg";
  $("undoB").disabled=!undoS.length;$("redoB").disabled=!redoS.length;}
window.addEventListener("beforeunload",function(e){if(dirty){e.preventDefault();e.returnValue="";}});

// ============ 경로 계산 ============
function cpLL(i){var c=CP[i];if(c&&c.lat!=null&&isFinite(c.lat))return [c.lat,c.lon];var s=SEG[i]&&SEG[i].length?SEG[i][0]:(SEG[i-1]&&SEG[i-1].length?SEG[i-1][SEG[i-1].length-1]:null);return s?[s[0],s[1]]:null;}
function projSeg(p,a,b){var cl=Math.cos(p[0]*RAD),M=111320,ax=(a[1]-p[1])*M*cl,ay=(a[0]-p[0])*M,bx=(b[1]-p[1])*M*cl,by=(b[0]-p[0])*M,dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy,t=L>0?-(ax*dx+ay*dy)/L:0;t=Math.max(0,Math.min(1,t));
  var x=ax+t*dx,y=ay+t*dy;return {t:t,d:Math.sqrt(x*x+y*y),ll:[a[0]+t*(b[0]-a[0]),a[1]+t*(b[1]-a[1])]};}
// 점에서 가장 가까운 폴리라인 위치 (from 이후)
function nearestOn(pts,p,from){var best=null;for(var i=Math.max(1,from||1);i<pts.length;i++){var r=projSeg(p,pts[i-1],pts[i]);if(!best||r.d<best.d)best={i:i,t:r.t,d:r.d,ll:r.ll};}return best;}
// 공개 형식 track → 지점 km에 맞춘 [lat,lon,km,ele]
function calibrate(raw,cps){
  var pts=raw.map(function(p){return Array.isArray(p)?[+p[0],+p[1],p[2]==null?null:+p[2],p[3]==null?null:+p[3]]:[+p.lat,+p.lon,p.km==null?null:+p.km,p.ele==null?null:+p.ele];})
    .filter(function(p){return isFinite(p[0])&&isFinite(p[1]);});
  if(pts.length<2)return [];
  var given=pts.every(function(p,i){return p[2]!=null&&isFinite(p[2])&&(!i||p[2]>=pts[i-1][2]);});
  if(given)return pts;
  var g=[0];for(var i=1;i<pts.length;i++)g.push(g[i-1]+hav(pts[i-1],pts[i])/1000);
  var an=[],from=1,lastKm=-1;
  cps.forEach(function(c){if(c.lat==null||!isFinite(c.lat))return;var r=nearestOn(pts,[c.lat,c.lon],from);if(!r||r.d>400||c.km<=lastKm)return;
    var k=g[r.i-1]+r.t*(g[r.i]-g[r.i-1]);if(an.length&&k<=an[an.length-1][0]+0.005)return;an.push([k,c.km]);from=r.i;lastKm=c.km;});
  var map;
  if(an.length){if(an[0][0]>0.01)an.unshift([0,Math.max(0,an[0][1]-an[0][0])]);
    map=function(v){for(var i=0;i<an.length-1;i++){if(v<=an[i+1][0]){var a=an[i],b=an[i+1];return a[1]+(v-a[0])/((b[0]-a[0])||1)*(b[1]-a[1]);}}var L=an[an.length-1];return L[1]+(v-L[0]);};}
  else{var tot=g[g.length-1],want=cps.length?cps[cps.length-1].km:0,sc=(want>0&&tot>0&&want/tot>0.6&&want/tot<1.6)?want/tot:1;map=function(v){return v*sc;};}
  return pts.map(function(p,i){return [p[0],p[1],map(g[i]),p[3]];});
}
function trackAt(tr,k){if(k<=tr[0][2])return [tr[0][0],tr[0][1],tr[0][3]];for(var i=1;i<tr.length;i++){if(k<=tr[i][2]){var a=tr[i-1],b=tr[i],f=(k-a[2])/((b[2]-a[2])||1);return [a[0]+f*(b[0]-a[0]),a[1]+f*(b[1]-a[1]),a[3]];}}var L=tr[tr.length-1];return [L[0],L[1],L[3]];}
function buildSegs(tr){
  var out=[];
  for(var i=0;i<CP.length-1;i++){var a=CP[i],b=CP[i+1];
    if(tr.length>=2){var s=[trackAt(tr,a.km)];tr.forEach(function(p){if(p[2]>a.km&&p[2]<b.km)s.push([p[0],p[1],p[3]]);});s.push(trackAt(tr,b.km));out.push(s);}
    else{var pa=a.lat!=null?[a.lat,a.lon,null]:null,pb=b.lat!=null?[b.lat,b.lon,null]:null;out.push(pa&&pb?[pa,pb]:[]);}}
  return out;}
// 저장용 track: 구간마다 계획 km를 길이 비율로 나눠 붙인다
function exportTrack(){var out=[];
  SEG.forEach(function(s,i){if(s.length<2)return;var a=CP[i].km,b=CP[i+1].km,g=[0];for(var k=1;k<s.length;k++)g.push(g[k-1]+hav(s[k-1],s[k]));var G=g[g.length-1]||1;
    s.forEach(function(p,k){if(out.length&&k===0)return;var km=+(a+(b-a)*g[k]/G).toFixed(4),row=[r6(p[0]),r6(p[1]),km];if(p[2]!=null&&isFinite(p[2]))row.push(Math.round(p[2]));out.push(row);});});
  return out;}
function toPublic(){
  var o=Object.assign({},META.extra||{},{format:"hikepace-course",version:1,id:META.id,updatedAt:META.updatedAt||0,name:META.name,sport:META.sport||"hike",date:META.date||"",endTime:META.endTime||"",endLabel:META.endLabel||"",notes:META.notes||""});
  o.checkpoints=CP.map(function(c){var x={name:c.name,km:+(+c.km).toFixed(3),arrive:c.arrive||"",depart:c.depart||"",note:c.note||"",peak:!!c.peak,cutoff:c.cutoff||"",cutoffBy:c.cutoffBy==="depart"?"depart":"arrive",cutoffAction:c.cutoffAction||"",radiusKm:+(+c.radiusKm||0.15).toFixed(3)};
    if(c.route==="fixed")x.route="fixed";var p=cpLL(CP.indexOf(c));if(c.lat!=null&&isFinite(c.lat)){x.lat=r6(c.lat);x.lon=r6(c.lon);}else if(p){x.lat=r6(p[0]);x.lon=r6(p[1]);}return x;});
  o.track=exportTrack();delete o.rev;return o;}
function problems(){var e=[],w=[];
  if(!META)return {e:["코스가 없어요"],w:w};
  if(!String(META.name||"").trim())e.push("코스 이름이 없어요");
  if(CP.length<2)e.push("지점이 2개 이상 있어야 해요");
  CP.forEach(function(c,i){if(!normT(c.arrive))e.push((i+1)+"번 '"+c.name+"' 도착 시각이 없어요");
    if(i&&+c.km<+CP[i-1].km)e.push((i+1)+"번 '"+c.name+"' km가 앞 지점보다 작아요");
    if(i&&normT(c.arrive)&&normT(CP[i-1].depart||CP[i-1].arrive)&&hm(c.arrive)<hm(CP[i-1].depart||CP[i-1].arrive))w.push((i+1)+"번 '"+c.name+"' 도착 시각이 앞 지점보다 빨라요 (자정 넘김?)");});
  SEG.forEach(function(s,i){if(s.length<2)w.push((i+1)+"구간 경로가 비어 있어요");});
  return {e:e,w:w};}

// ============ 코스 열기 ============
function newId(){return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function loadCourse(o,src){
  if(!o||!Array.isArray(o.checkpoints)||o.checkpoints.length<2)throw new Error("코스 파일(hikepace-course) 형식이 아니에요");
